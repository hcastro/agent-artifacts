<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doc diagrams source</title>
<!-- Source for the rendered diagrams next to this file. Re-render with:
     node <doc-diagrams skill>/scripts/render.cjs <this file> <assets dir>
     Each <svg data-name="NN-slug"> becomes NN-slug.webp. Canvas: 1200 user units wide. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: #0F151B; padding: 24px; display: grid; gap: 24px; }
  svg[data-name] { display: block; width: 1200px; height: auto; }

  /* Canvas and text */
  .bg { fill: #0F151B; }
  .title { font: 700 28px "Bricolage Grotesque", "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .subtitle { font: 400 15px "IBM Plex Sans", sans-serif; fill: #93A2AF; }
  .h { font: 600 16px "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .h-lg { font: 700 19px "Bricolage Grotesque", "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .s { font: 400 12.5px "IBM Plex Mono", monospace; fill: #93A2AF; }
  .s-sm { font: 400 12px "IBM Plex Mono", monospace; fill: #93A2AF; }
  .li { font: 400 14px "IBM Plex Sans", sans-serif; fill: #C9D4DD; }
  .lbl { font: 500 12px "IBM Plex Mono", monospace; }
  .grp { font: 600 12px "IBM Plex Mono", monospace; fill: #93A2AF; letter-spacing: .06em; text-transform: uppercase; }

  /* Boxes: .box node, .box-dash planned or external, .group container */
  .box { fill: #172029; stroke: #2C3946; stroke-width: 1.5; }
  .box-dash { fill: none; stroke: #415060; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .group { fill: #121A22; stroke: #2C3946; stroke-width: 1.5; }

  /* Edges: one color per meaning, dashed for planned, fallback or lookup */
  .e { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 6; }
  .c1 { stroke: #FF7A4D; } .t-c1 { fill: #FF7A4D; }
  .c2 { stroke: #2FC6B0; } .t-c2 { fill: #2FC6B0; }
  .c3 { stroke: #6E9DFF; } .t-c3 { fill: #6E9DFF; }
  .c4 { stroke: #FF5A68; } .t-c4 { fill: #FF5A68; }
  .c5 { stroke: #E3A92B; } .t-c5 { fill: #E3A92B; }
  .mute { stroke: #93A2AF; } .t-mute { fill: #93A2AF; }
</style>
</head>
<body>
<!-- Arrowheads, one per edge color. Reference with marker-end="url(#a-c1)". -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="a-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A4D"/></marker>
    <marker id="a-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2FC6B0"/></marker>
    <marker id="a-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E9DFF"/></marker>
    <marker id="a-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5A68"/></marker>
    <marker id="a-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E3A92B"/></marker>
    <marker id="a-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93A2AF"/></marker>
  </defs>
</svg>

<!-- Figure 1: the pipeline. Blue edges move forward, the amber dashed edge is feedback. -->
<svg data-name="01-pipeline" viewBox="0 0 1200 590" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="590" rx="18"/>
  <text class="title" x="40" y="56">Different agents research, write and check every question</text>
  <text class="subtitle" x="40" y="84">Subagents do steps 1 to 3. The main session keeps the spine, the design and the judgment calls.</text>

  <path class="e c3" d="M240 180 L282 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M510 180 L552 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M780 180 L822 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M995 230 L995 332" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M830 390 L788 390" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M560 390 L518 390" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M290 390 L248 390" marker-end="url(#a-c3)"/>

  <path class="e c5 dash" d="M400 440 L400 506 L995 506 L995 448" marker-end="url(#a-c5)"/>
  <rect x="490" y="494" width="414" height="24" rx="12" fill="#0F151B" stroke="#E3A92B" stroke-width="1.2"/>
  <text class="lbl t-c5" x="697" y="510" text-anchor="middle">the learner's reactions change the look and the words</text>

  <rect class="box-dash" x="40" y="130" width="200" height="100" rx="12"/>
  <text class="h" x="60" y="166">The sources</text>
  <text class="s" x="60" y="192">code, docs, runbooks</text>
  <text class="s" x="60" y="212">real runs, captures</text>
  <rect class="box" x="290" y="130" width="220" height="100" rx="12"/>
  <text class="h" x="310" y="166">1. Research</text>
  <text class="s" x="310" y="192">one agent per area</text>
  <text class="s" x="310" y="212">evidence as path:line</text>
  <rect class="box" x="560" y="130" width="220" height="100" rx="12"/>
  <text class="h" x="580" y="166">2. Author</text>
  <text class="s" x="580" y="192">scenario questions</text>
  <text class="s" x="580" y="212">about decisions</text>
  <rect class="box" x="830" y="130" width="330" height="100" rx="12" style="stroke:#6E9DFF"/>
  <text class="h" x="850" y="166">3. Fact-check</text>
  <text class="s" x="850" y="192">agents that did not write it</text>
  <text class="s" x="850" y="212">a report with before and after</text>
  <rect class="box" x="830" y="340" width="330" height="100" rx="12"/>
  <text class="h" x="850" y="376">4. Build and design</text>
  <text class="s" x="850" y="402">starter kit and course.json</text>
  <text class="s" x="850" y="422">the look comes from the subject</text>
  <rect class="box" x="560" y="340" width="220" height="100" rx="12"/>
  <text class="h" x="580" y="376">5. Test and publish</text>
  <text class="s" x="580" y="402">automated learner test</text>
  <text class="s" x="580" y="422">check the live page</text>
  <rect class="box" x="290" y="340" width="220" height="100" rx="12"/>
  <text class="h" x="310" y="376">6. Learner checkpoint</text>
  <text class="s" x="310" y="402">one placement</text>
  <text class="s" x="310" y="422">five questions read</text>
  <rect class="box" x="40" y="340" width="200" height="100" rx="12"/>
  <text class="h" x="60" y="376">7. Voice pass</text>
  <text class="s" x="60" y="402">one stop first</text>
  <text class="s" x="60" y="422">blind comparison</text>

  <g transform="translate(40 562)">
    <rect width="14" height="4" y="-6" rx="2" fill="#6E9DFF"/><text class="lbl t-mute" x="22" y="0">next step</text>
    <rect x="130" width="14" height="4" y="-6" rx="2" fill="#E3A92B"/><text class="lbl t-mute" x="152" y="0">feedback</text>
  </g>
</svg>
</body>
</html>
