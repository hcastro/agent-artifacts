<title>{{title}}</title>
<style>
/* Default look: a line map. Each course line is a colored line with a stop per topic, and the map is
   the one bold element. Everything around it is ink on paper: signage type, square corners, no boxed
   card grid. Restyle for your subject by changing the tokens below first. Line colors are assigned by
   position (.line-1 to .line-4), so a course never needs new CSS to add a line.
   The page makes no outside requests, so the type uses fonts the reader's system already has. A font
   you have the right to embed can go in an @font-face rule with a data: URL. */
@property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --raised: #F4F4F2; --ink: #1E1E1C; --muted: #5C5C57; --faint: #7A7A74;
  --line: #D8D8D3; --line-soft: #EAEAE6; --accent: #2D5BA8; --accent-ink: #FFFFFF; --accent-soft: #EBF0F8; --focus: #D99A00;
  --line-1: #C8452D; --line-1-ink: #FFFFFF;
  --line-2: #2E7D4F; --line-2-ink: #FFFFFF;
  --line-3: #2D5BA8; --line-3-ink: #FFFFFF;
  --line-4: #7A4A9C; --line-4-ink: #FFFFFF;
  --good: #0B7A4B; --good-soft: #E4F4EC; --bad: #C4321C; --bad-soft: #FBEAE6; --warn: #8A6200; --warn-soft: #FFF3C9;
  --code-bg: #F4F4F2; --shadow: 0 8px 24px rgba(30,30,28,.16);
  --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --r-s: 3px; --r-m: 4px; --r-l: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --surface: #141413; --raised: #1E1E1C; --ink: #F2F2EE; --muted: #B5B5AE; --faint: #8C8C86;
  --line: #3A3A36; --line-soft: #262624; --accent: #8FB1F0; --accent-ink: #141413; --accent-soft: #1F2A3D; --focus: #F2C14E;
  --line-1: #F07B62; --line-1-ink: #141413;
  --line-2: #5CC48A; --line-2-ink: #141413;
  --line-3: #8FB1F0; --line-3-ink: #141413;
  --line-4: #C49BE6; --line-4-ink: #141413;
  --good: #4FD19A; --good-soft: #0F3A2C; --bad: #FF8A75; --bad-soft: #45191A; --warn: #F5C84B; --warn-soft: #3A2F0C;
  --code-bg: #1C1C1A; --shadow: 0 10px 28px rgba(0,0,0,.45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141413; --surface: #141413; --raised: #1E1E1C; --ink: #F2F2EE; --muted: #B5B5AE; --faint: #8C8C86;
  --line: #3A3A36; --line-soft: #262624; --accent: #8FB1F0; --accent-ink: #141413; --accent-soft: #1F2A3D; --focus: #F2C14E;
  --line-1: #F07B62; --line-1-ink: #141413;
  --line-2: #5CC48A; --line-2-ink: #141413;
  --line-3: #8FB1F0; --line-3-ink: #141413;
  --line-4: #C49BE6; --line-4-ink: #141413;
  --good: #4FD19A; --good-soft: #0F3A2C; --bad: #FF8A75; --bad-soft: #45191A; --warn: #F5C84B; --warn-soft: #3A2F0C;
  --code-bg: #1C1C1A; --shadow: 0 10px 28px rgba(0,0,0,.45); color-scheme: dark;
}
/* every element that wears a line color reads it through --lc */
.line-1 { --lc: var(--line-1); --lc-ink: var(--line-1-ink); }
.line-2 { --lc: var(--line-2); --lc-ink: var(--line-2-ink); }
.line-3 { --lc: var(--line-3); --lc-ink: var(--line-3-ink); }
.line-4 { --lc: var(--line-4); --lc-ink: var(--line-4-ink); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: 0; line-height: 1.02; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: .86em; }
:not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.eyebrow { display: inline-block; font: 700 14px/1.25 var(--body); color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.small-note { font-size: 14px; font-weight: 400; }

/* ── shell ── */
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); border-bottom: 2px solid var(--ink); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font: 800 25px/1 var(--display); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand svg { width: 24px; height: 24px; flex: none; }
.nav { display: flex; align-self: stretch; margin-left: 6px; }
.nav button { position: relative; padding: 0 13px; min-height: 56px; font: 600 16px/1 var(--body); color: var(--muted); transition: color 150ms ease; }
.nav button:hover { color: var(--ink); }
.nav button::after { content: ""; position: absolute; left: 13px; right: 13px; bottom: 0; height: 5px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 260ms var(--ease-out); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"]::after { transform: scaleX(1); }
.meters { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.meter { display: inline-flex; align-items: center; gap: 5px; font: 700 16px/1 var(--body); white-space: nowrap; }
.meter svg { width: 15px; height: 15px; }
.meter.hot { color: var(--warn); }
.icon-btn { width: 36px; height: 36px; border-radius: var(--r-m); display: inline-grid; place-items: center; border: 1.5px solid var(--line); transition: transform 120ms var(--ease-out), border-color 150ms ease; }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 16px; height: 16px; }
main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 26px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { display: none; }
@media (max-width: 820px) {
  .nav { display: none; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg); border-top: 2px solid var(--ink); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; }
  .tabbar button { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 9px 2px 7px; font-size: 12px; font-weight: 600; color: var(--muted); border-top: 4px solid transparent; margin-top: -2px; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
  .meter.xp { display: none; }
}
.view { animation: view-in 320ms var(--ease-out) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── buttons and tags ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: var(--r-m); font: 600 16.5px/1.2 var(--body); border: 2px solid var(--ink); color: var(--ink); background: transparent; transition: transform 120ms var(--ease-out), background 150ms ease, color 150ms ease, border-color 150ms ease; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; color: var(--muted); padding: 8px 10px; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.btn.quiet:hover { background: transparent; color: var(--ink); text-decoration-color: var(--ink); }
.btn.small { padding: 7px 12px; font-size: 15px; border-width: 1.5px; }
.btn.quiet.small { padding: 6px 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--r-s); font: 600 13.5px/1.3 var(--body); border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
/* a line chip keeps ink text and shows the line color as a swatch, so light line colors stay readable */
.chip[class*="line-"] { color: var(--ink); border-color: var(--lc); }
.chip[class*="line-"]::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--lc); flex: none; }
.chip.good { color: var(--good); border-color: currentColor; background: var(--good-soft); }
.chip.bad { color: var(--bad); border-color: currentColor; background: var(--bad-soft); }
.chip.warn { color: var(--warn); border-color: currentColor; background: var(--warn-soft); }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-l); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
.plain-list { padding-left: 18px; display: grid; gap: 6px; margin: 0; }

/* ── home: headline, then the map ── */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: end; padding: 14px 0 34px; }
.home-hero h1 { font-size: clamp(56px, 9.4vw, 124px); font-weight: 800; line-height: .9; }
.home-hero h1 + .row { margin-top: 26px; }
.home-aside { display: grid; gap: 0; align-content: end; }
.aside-row { display: block; width: 100%; text-align: left; padding: 14px 0; border-top: 1.5px solid var(--line); }
.aside-row:first-child { border-top: 2px solid var(--ink); }
.aside-row b { display: block; font: 700 25px/1.05 var(--display); }
.aside-row span { display: block; font-size: 15.5px; color: var(--muted); margin-top: 4px; }
button.aside-row:hover b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.standing-bar { height: 6px; background: var(--line-soft); margin-top: 10px; }
.standing-bar i { display: block; height: 100%; background: var(--ink); transition: width 700ms var(--ease-out); }
@media (max-width: 900px) { .home-hero { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-bottom: 26px; } }

.map { border-top: 2px solid var(--ink); }
.mline { padding: 24px 0 26px; border-bottom: 1.5px solid var(--line); }
.mline-head { display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; margin-bottom: 22px; }
.bullet { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 23px/1 var(--display); background: var(--lc); color: var(--lc-ink); flex: none; }
.mline-head h2 { font-size: 32px; font-weight: 700; }
.mline-head .what { color: var(--muted); font-size: 16px; flex: 1 1 280px; min-width: 0; }
.mline-head .pct { font: 700 25px/1 var(--display); }
.stops { position: relative; display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); padding-top: 34px; }
.stops::before { content: ""; position: absolute; left: 18px; top: 48px; width: calc(100% * (var(--n, 7) - 1) / var(--n, 7)); height: 8px; background: linear-gradient(var(--lc), var(--lc)) no-repeat left top / 100% 100%; animation: line-draw 900ms var(--ease-in-out) backwards; }
@keyframes line-draw { from { background-size: 0% 100%; } }
.stop { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; padding: 48px 14px 4px 0; animation: build-in 520ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 70ms + 200ms); }
.stop .mk { position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); background: conic-gradient(var(--lc) calc(var(--p) * 1turn), var(--bg) 0); display: grid; place-items: center; transition: --p 1100ms var(--ease-out) 700ms, transform 160ms var(--ease-out); }
.stop .mk::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.stop .mk b { position: relative; font: 800 16px/1 var(--display); }
.stop.full .mk::before { background: var(--lc); }
.stop.full .mk b { color: var(--lc-ink); }
.stop:hover .mk { transform: scale(1.12); }
.stop .nm { display: block; font: 600 20px/1.08 var(--display); }
.stop:hover .nm { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.stop .ds { display: block; font-size: 14.5px; line-height: 1.3; margin-top: 5px; }
.stop .st { display: block; font-size: 13.5px; line-height: 1.3; color: var(--muted); margin-top: 5px; }
.here-tag { position: absolute; left: -7px; top: -32px; background: var(--ink); color: var(--bg); font: 700 13px/1 var(--body); padding: 6px 8px; border-radius: var(--r-s); white-space: nowrap; animation: here 1800ms var(--ease-in-out) 1400ms 2 both; }
.here-tag::after { content: ""; position: absolute; left: 19px; top: 100%; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
@keyframes here { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.mline-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; font-size: 14.5px; color: var(--muted); }
@media (max-width: 860px) {
  .stops { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .stops::before { left: 14px; top: 18px; bottom: 40px; width: 8px; height: auto; animation-name: line-draw-v; }
  .stop { padding: 5px 0 22px 54px; min-height: 62px; }
  .here-tag { position: static; display: inline-block; margin-bottom: 6px; animation: none; }
  .here-tag::after { display: none; }
  .mline-head h2 { font-size: 28px; }
}
@keyframes line-draw-v { from { background-size: 100% 0%; } }
.home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mini { padding: 24px 28px 8px 0; }
.mini + .mini { padding-left: 28px; border-left: 1.5px solid var(--line); }
.mini h3 { font-size: 25px; margin-bottom: 10px; }
.mini li { font-size: 15.5px; margin: 0 0 9px; }
.mini ul { margin: 0 0 6px; padding-left: 18px; }
@media (max-width: 900px) { .home-grid { grid-template-columns: minmax(0, 1fr); } .mini, .mini + .mini { padding: 22px 0 14px; border-left: 0; border-bottom: 1.5px solid var(--line); } }
.calib { display: grid; gap: 9px; }
.calib-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 15px; }
.calib-bar { height: 8px; background: var(--line-soft); overflow: hidden; }
.calib-bar i { display: block; height: 100%; background: var(--ink); transition: width 700ms var(--ease-out); }

/* level rows on the placement result */
.span-row { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 40px; gap: 12px; align-items: center; width: 100%; padding: 10px 6px; border-top: 1.5px solid var(--line); text-align: left; transition: background 150ms ease; }
.span-row:hover { background: var(--raised); }
.span-row .name { font: 600 19px/1.1 var(--display); min-width: 0; }
.span-row.focus .name { color: var(--accent); }
.span-row .lvl { font: 700 17px/1 var(--display); text-align: right; }
.span-track { position: relative; height: 10px; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(20% - 2px), var(--bg) calc(20% - 2px), var(--bg) 20%); background-color: var(--line); overflow: hidden; }
.span-fill { position: absolute; inset: 0 auto 0 0; min-width: 3px; background: var(--ink); transition: width 900ms var(--ease-out); }
.span-row.focus .span-fill { background: var(--lc, var(--accent)); }

/* ── learn ── */
.learn { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.learn.solo { grid-template-columns: minmax(0, 780px); justify-content: start; }
@media (max-width: 980px) { .learn { grid-template-columns: minmax(0, 1fr); gap: 26px; } }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.diff { display: inline-flex; align-items: center; gap: 6px; font: 600 13.5px/1 var(--body); color: var(--muted); }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ink); }
.qcard { padding: 0; border: 0; background: none; border-radius: 0; }
.qcard h2 { font: 600 15.5px/1.3 var(--body); color: var(--muted); margin-bottom: 8px; }
.qcard .page-title { font-size: clamp(44px, 6.4vw, 84px); line-height: .92; }
.prompt { font: 500 23px/1.34 var(--body); margin-bottom: 20px; max-width: 58ch; }
.prompt strong { font-weight: 700; }
.prompt p + p { margin-top: 10px; }
.build > * { animation: build-in 520ms var(--ease-out) both; }
.build > *:nth-child(2) { animation-delay: 60ms; } .build > *:nth-child(3) { animation-delay: 120ms; } .build > *:nth-child(4) { animation-delay: 180ms; } .build > *:nth-child(5) { animation-delay: 240ms; } .build > *:nth-child(n+6) { animation-delay: 300ms; }
@keyframes build-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.opts { display: grid; margin-bottom: 20px; border-top: 1.5px solid var(--line); }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; padding: 14px 12px 14px 8px; border-bottom: 1.5px solid var(--line); border-left: 5px solid transparent; font-size: 17.5px; line-height: 1.4; transition: background 150ms ease, border-color 150ms ease; }
.opt:hover { background: var(--raised); }
.opt .key { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 17px/1 var(--display); border: 2.5px solid var(--ink); transition: background 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
.opt .key svg { width: 15px; height: 15px; }
.opt:active .key { transform: scale(.9); }
.opt[aria-checked="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .key { background: var(--ink); color: var(--bg); }
.opt.right { border-left-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { border-left-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.dim { opacity: .5; }
.shake { animation: shake 360ms var(--ease-out); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
.order { display: grid; gap: 8px; margin-bottom: 18px; }
.order-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--surface); transition: transform 240ms var(--ease-out), border-color 150ms ease; }
.order-item .n { font: 700 17px/1 var(--display); width: 30px; height: 30px; display: grid; place-items: center; border: 2.5px solid var(--ink); border-radius: 50%; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 32px; height: 32px; border-radius: var(--r-m); border: 1.5px solid var(--line); display: grid; place-items: center; }
.order-item .mv button:hover { border-color: var(--ink); }
.order-item .mv button[disabled] { opacity: .35; cursor: default; }
.order-item .mv svg { width: 14px; height: 14px; }
.buckets { display: grid; margin-bottom: 18px; border-top: 1.5px solid var(--line); }
.b-item { padding: 13px 10px 13px 8px; border-bottom: 1.5px solid var(--line); border-left: 5px solid transparent; }
.b-item .txt { font-size: 17px; margin-bottom: 9px; }
.b-item .pick { display: flex; flex-wrap: wrap; gap: 6px; }
.b-item .pick button { padding: 5px 10px; border-radius: var(--r-s); border: 1.5px solid var(--line); font: 600 14px/1.3 var(--body); color: var(--muted); transition: background 150ms ease, border-color 150ms ease, color 150ms ease; }
.b-item .pick button:hover { border-color: var(--ink); color: var(--ink); }
