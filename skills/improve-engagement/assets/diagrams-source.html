<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doc diagrams source</title>
<!-- Source for the rendered diagrams next to this file. Re-render with:
     node <doc-diagrams skill>/scripts/render.cjs <this file> <assets dir>
     Each <svg data-name="NN-slug"> becomes NN-slug.webp. Canvas: 1200 user units wide. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: #0F151B; padding: 24px; display: grid; gap: 24px; }
  svg[data-name] { display: block; width: 1200px; height: auto; }

  /* Canvas and text */
  .bg { fill: #0F151B; }
  .title { font: 700 28px "Bricolage Grotesque", "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .subtitle { font: 400 15px "IBM Plex Sans", sans-serif; fill: #93A2AF; }
  .h { font: 600 16px "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .h-lg { font: 700 19px "Bricolage Grotesque", "IBM Plex Sans", sans-serif; fill: #E5ECF2; }
  .s { font: 400 12.5px "IBM Plex Mono", monospace; fill: #93A2AF; }
  .s-sm { font: 400 12px "IBM Plex Mono", monospace; fill: #93A2AF; }
  .li { font: 400 14px "IBM Plex Sans", sans-serif; fill: #C9D4DD; }
  .lbl { font: 500 12px "IBM Plex Mono", monospace; }
  .grp { font: 600 12px "IBM Plex Mono", monospace; fill: #93A2AF; letter-spacing: .06em; text-transform: uppercase; }

  /* Boxes: .box node, .box-dash planned or external, .group container */
  .box { fill: #172029; stroke: #2C3946; stroke-width: 1.5; }
  .box-dash { fill: none; stroke: #415060; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .group { fill: #121A22; stroke: #2C3946; stroke-width: 1.5; }

  /* Edges: one color per meaning, dashed for planned, fallback or lookup */
  .e { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 6; }
  .c1 { stroke: #FF7A4D; } .t-c1 { fill: #FF7A4D; }
  .c2 { stroke: #2FC6B0; } .t-c2 { fill: #2FC6B0; }
  .c3 { stroke: #6E9DFF; } .t-c3 { fill: #6E9DFF; }
  .c4 { stroke: #FF5A68; } .t-c4 { fill: #FF5A68; }
  .c5 { stroke: #E3A92B; } .t-c5 { fill: #E3A92B; }
  .mute { stroke: #93A2AF; } .t-mute { fill: #93A2AF; }
</style>
</head>
<body>
<!-- Arrowheads, one per edge color. Reference with marker-end="url(#a-c1)". -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="a-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A4D"/></marker>
    <marker id="a-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2FC6B0"/></marker>
    <marker id="a-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E9DFF"/></marker>
    <marker id="a-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5A68"/></marker>
    <marker id="a-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E3A92B"/></marker>
    <marker id="a-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93A2AF"/></marker>
  </defs>
</svg>

<!-- Figure 1: the loop. Blue edges move forward, amber dashed edges go back. -->
<svg data-name="01-loop" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text class="title" x="40" y="56">A rewrite is applied only after readers and a checker pass it</text>
  <text class="subtitle" x="40" y="84">One sample goes through the loop first. The rest of the text follows the version the writer picks.</text>

  <!-- forward edges -->
  <path class="e c3" d="M255 180 L292 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M515 180 L552 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M800 180 L842 180" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M1005 230 L1005 322" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M850 380 L808 380" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M560 380 L523 380" marker-end="url(#a-c3)"/>
  <path class="e c3" d="M300 380 L263 380" marker-end="url(#a-c3)"/>

  <!-- back edges -->
  <path class="e c5 dash" d="M680 330 L680 238" marker-end="url(#a-c5)"/>
  <text class="lbl t-c5" x="694" y="285">fix, then guard again</text>
  <path class="e c5 dash" d="M1005 430 L1005 486 L20 486 L20 180 L32 180" marker-end="url(#a-c5)"/>
  <rect x="335" y="474" width="356" height="24" rx="12" fill="#0F151B" stroke="#E3A92B" stroke-width="1.2"/>
  <text class="lbl t-c5" x="513" y="490" text-anchor="middle">no version beats the original: back to step 1</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="130" width="215" height="100" rx="12"/>
  <text class="h" x="60" y="166">1. Name the reader</text>
  <text class="s" x="60" y="192">who reads, and when</text>
  <text class="s" x="60" y="212">3 to 5 checks</text>

  <rect class="box" x="300" y="130" width="215" height="100" rx="12"/>
  <text class="h" x="320" y="166">2. Measure the draft</text>
  <text class="s" x="320" y="192">words per sentence</text>
  <text class="s" x="320" y="212">names per sentence</text>

  <rect class="box" x="560" y="130" width="240" height="100" rx="12"/>
  <text class="h" x="580" y="166">3. Rewrite one sample</text>
  <text class="s" x="580" y="192">structure pass</text>
  <text class="s" x="580" y="212">then voice pass</text>

  <rect class="box" x="850" y="130" width="310" height="100" rx="12"/>
  <text class="h" x="870" y="166">4. Script guard</text>
  <text class="s" x="870" y="192">new names, new numbers,</text>
  <text class="s" x="870" y="212">changed quotations, growth</text>

  <!-- row 2 -->
  <rect class="box" x="850" y="330" width="310" height="100" rx="12" style="stroke:#6E9DFF"/>
  <text class="h" x="870" y="366">4. Blind read test</text>
  <text class="s" x="870" y="392">judges see labels X, Y, Z only</text>
  <text class="s" x="870" y="412">the key sits in another folder</text>

  <rect class="box" x="560" y="330" width="240" height="100" rx="12"/>
  <text class="h" x="580" y="366">5. Fidelity check</text>
  <text class="s" x="580" y="392">claims dropped, added</text>
  <text class="s" x="580" y="412">or changed</text>

  <rect class="box" x="300" y="330" width="215" height="100" rx="12"/>
  <text class="h" x="320" y="366">6. Writer picks</text>
  <text class="s" x="320" y="392">scores are evidence</text>
  <text class="s" x="320" y="412">taste decides</text>

  <rect class="box-dash" x="40" y="330" width="215" height="100" rx="12"/>
  <text class="h" x="60" y="366">Apply to the rest</text>
  <text class="s" x="60" y="392">same brief, in batches</text>
  <text class="s" x="60" y="412">guard and check each</text>

  <g transform="translate(40 534)">
    <rect width="14" height="4" y="-6" rx="2" fill="#6E9DFF"/><text class="lbl t-mute" x="22" y="0">next step</text>
    <rect x="130" width="14" height="4" y="-6" rx="2" fill="#E3A92B"/><text class="lbl t-mute" x="152" y="0">go back</text>
  </g>
</svg>
</body>
</html>
